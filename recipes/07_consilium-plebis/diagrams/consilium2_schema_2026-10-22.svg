<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="1360" height="1280" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Consilium Plebis architecture, one perspective">
<title>Consilium Plebis architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#ffffff"/>
<text x="40" y="22" font-size="14" font-weight="600" fill="#2C2C2A">Consilium Plebis, one perspective (the other one is the same)</text>
<g>
<rect x="40" y="40" width="165" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="122" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Router</text>
<text x="122" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">By opponent material</text>
</g>
<line x1="122" y1="96" x2="122" y2="138" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="140" width="165" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="122" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">HalfKA</text>
<text x="122" y="182" text-anchor="middle" font-size="12" fill="#0F6E56">8 expert copies</text>
<rect x="225" y="140" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="287" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Threats</text>
<text x="287" y="182" text-anchor="middle" font-size="12" fill="#5F5E5A">Shared</text>
<rect x="370" y="140" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="432" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Pawn pairs</text>
<text x="432" y="182" text-anchor="middle" font-size="12" fill="#5F5E5A">Shared</text>
<rect x="515" y="140" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="577" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Passed pawns</text>
<text x="577" y="182" text-anchor="middle" font-size="12" fill="#5F5E5A">Shared</text>
<line x1="140" y1="196" x2="200" y2="248" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
