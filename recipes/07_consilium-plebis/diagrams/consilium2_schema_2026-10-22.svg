<line x1="432" y1="196" x2="432" y2="248" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="560" y1="196" x2="490" y2="248" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="140" y="250" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="340" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Accumulator, 1024 values</text>
<text x="340" y="292" text-anchor="middle" font-size="12" fill="#5F5E5A">One per perspective, summed rows</text>
<line x1="340" y1="306" x2="340" y2="348" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="140" y="350" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="340" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Pairwise product</text>
<text x="340" y="392" text-anchor="middle" font-size="12" fill="#5F5E5A">512 per side, side to move first</text>
<line x1="290" y1="406" x2="290" y2="448" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="140" y="450" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="290" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Layer stack (8 buckets by pieces)</text>
<text x="290" y="492" text-anchor="middle" font-size="12" fill="#534AB7">1024 → 32 → 32 → 1</text>
<rect x="470" y="450" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="555" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Pawn-king subnet</text>
<text x="555" y="492" text-anchor="middle" font-size="12" fill="#0F6E56">256 hidden, adds 32</text>
<line x1="470" y1="478" x2="444" y2="478" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="290" y1="506" x2="290" y2="548" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="140" y="550" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="290" y="572" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Evaluation</text>
<text x="290" y="592" text-anchor="middle" font-size="12" fill="#5F5E5A">Positional + PSQT</text>
<path d="M140 278 L100 278 L100 578 L138 578" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="94" y="432" text-anchor="end" font-size="12" fill="#5F5E5A">PSQT</text>
<rect x="470" y="560" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="488" y="570" font-size="12" fill="#5F5E5A">new in Consilium Plebis</text>
<rect x="470" y="580" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="488" y="590" font-size="12" fill="#5F5E5A">output stack</text>
</svg>
